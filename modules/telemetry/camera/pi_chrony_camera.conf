# Pi를 카메라(WiFiLink V2)의 NTP 서버로 — /etc/chrony/conf.d/camera.conf 로 설치
# 전제: Pi 시계의 GPS 동기 (mavlink_bridge spec §16.4 호스트 체인 — 미구현 상태에서는
#       Pi 시계 정확도만큼만 카메라 시계가 정확해짐)
#
# 카메라 쪽: OpenIPC에서 NTP 서버를 Pi 이더넷 IP로 지정
#   TODO(bench): 카메라측 NTP 설정 위치 확인 (busybox ntpd 인자 또는 majestic system 설정)

# 카메라 서브넷에 NTP 서비스 허용 (이더넷 직결 대역)
allow 192.168.1.0/24

# Pi 시계가 외부 동기 없이도(비행 중) 서버 역할을 하도록 로컬 스트라텀 허용
local stratum 10
